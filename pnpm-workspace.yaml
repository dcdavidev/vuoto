packages:
  - packages/*

allowBuilds:
  core-js-pure: true
  esbuild: true
  lefthook: true

engineStrict: true

minimumReleaseAgeExclude:
  - '@spellbookx/recipes@2.0.0'
  - commitlint-config-spellbookx@2.0.0
  - cspell-config-spellbookx@2.0.0
  - cz-config-spellbookx@2.0.0
  - eslint-plugin-spellbookx@2.0.0
  - prettier-config-spellbookx@2.0.0
  - '@dcdavidev/dropdx@0.4.1'

publicHoistPattern:
  - '*prettier-plugin-*'
  - '@prettier/plugin-*'
